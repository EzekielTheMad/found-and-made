name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Community Apps XML
        shell: python {0}
        run: |
          from pathlib import Path
          from xml.etree import ElementTree as ET

          profile = ET.parse("ca_profile.xml").getroot()
          assert profile.tag == "CommunityApplications"
          assert profile.findtext("Profile", "").strip()

          required = {
              "Name",
              "Repository",
              "Overview",
              "Support",
              "Project",
              "TemplateURL",
              "Category",
              "WebUI",
              "Icon",
              "License",
          }
          templates = sorted(Path("templates").glob("*.xml"))
          assert templates, "No Community Apps templates found"
          for path in templates:
              root = ET.parse(path).getroot()
              assert root.tag == "Container"
              missing = sorted(
                  field for field in required if not root.findtext(field, "").strip()
              )
              assert not missing, f"{path}: missing {', '.join(missing)}"
              assert root.findtext("Repository", "").startswith("ghcr.io/")
              assert root.findall("Screenshot"), f"{path}: no screenshots"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run verify:server
      - run: npm run verify:https-proxy
      - run: npx playwright install --with-deps chromium
      - if: github.event_name == 'pull_request'
        run: npm run test:e2e:built:smoke
      - if: github.event_name != 'pull_request'
        run: npm run test:e2e:built

  container:
    name: Container gate (amd64 and arm64 runtime)
    runs-on: ubuntu-latest
    needs: application
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'pull_request'
        env:
          CONTAINER_VERIFY_ARM64: "false"
        run: npm run verify:container
      - if: github.event_name != 'pull_request'
        run: npm run verify:container
