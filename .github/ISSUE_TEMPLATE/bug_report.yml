name: Bug report
description: Report a reproducible, non-sensitive Found & Made problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include recipes, databases, backups, credentials, tokens, email addresses, public origins, IP addresses, or unredacted logs. Security reports belong in the private vulnerability workflow.
  - type: input
    id: version
    attributes:
      label: Found & Made version
      description: Release and image tag, for example v0.1.0-alpha.0 and beta.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Unraid
        - Docker Compose
        - Docker CLI
        - Local development
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: Architecture
      placeholder: amd64 or arm64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic examples and the smallest reliable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include only short, sanitized error text.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I removed private content, credentials, addresses, identifiers, and complete logs.
          required: true
