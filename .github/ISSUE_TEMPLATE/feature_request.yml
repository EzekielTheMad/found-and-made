name: Feature request
description: Suggest a focused improvement to Found & Made.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What is difficult today, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the smallest useful result rather than a specific implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
      description: Optional. Explain how you handle this today.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not contain private recipe data, credentials, or personal identifiers.
          required: true
